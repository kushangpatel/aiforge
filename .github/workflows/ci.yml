name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types and unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install (exact versions from uv.lock)
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run --no-sync ruff check aiforge/ tests/

      - name: Format
        run: uv run --no-sync ruff format --check aiforge/ tests/

      - name: Type check
        run: uv run --no-sync mypy aiforge/

      - name: Unit tests
        run: uv run --no-sync pytest tests/unit -q

  lowest:
    # Proves the lower bounds in pyproject.toml are real: installs the oldest
    # allowed version of every direct dependency and runs the unit tests.
    name: Unit tests on lowest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (lowest direct versions)
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e ".[all]"

      - name: Unit tests
        run: .venv/bin/pytest tests/unit -q
