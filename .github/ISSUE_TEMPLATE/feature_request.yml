name: Feature request
description: Suggest a new capability, provider or module.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case, and what makes it hard with AI Forge today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: An API sketch or example usage helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
