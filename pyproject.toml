[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforge"
version = "0.1.0"
description = "Plug-and-play AI toolkit for product teams"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kushang Patel"}]
requires-python = ">=3.12"
keywords = ["ai", "llm", "langchain", "rag", "nlp", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "langchain-chroma>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.0.0",
    "tiktoken>=0.7.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "langchain-openai>=0.2.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
anthropicai = [
    "langchain-anthropic>=0.2.0",
    "langchain-voyageai>=0.2.0",
]
local = ["langchain-ollama>=0.2.0"]
agentic = ["langgraph>=0.2.0"]
server = ["fastapi>=0.115.0", "uvicorn>=0.32.0"]
playground = ["streamlit>=1.40.0"]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "langsmith>=0.1.0",
]
docs = ["pypdf>=4.0.0", "python-docx>=1.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]
all = [
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-voyageai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "streamlit>=1.40.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "langsmith>=0.1.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
aiforge = "aiforge.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aiforge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
