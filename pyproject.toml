[build-system]
# setuptools 77 is the first release that accepts an SPDX `license` string.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforge-kit"
# The version lives in aiforge/__version__.py; setuptools reads it statically.
dynamic = ["version"]
description = "Plug-and-play AI toolkit for product teams"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kushang Patel"}]
requires-python = ">=3.12"
keywords = [
    "ai", "llm", "langchain", "rag", "nlp", "openai", "anthropic", "claude",
    "mcp", "summarization", "document-qa", "structured-output",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Floors are the oldest versions CI has verified (see the "lowest" job);
# the AI-stack packages are capped below their next major because they make
# breaking changes there (e.g. mcp 2.0 renamed Tool.inputSchema). Exact,
# tested versions for development and CI live in uv.lock.
dependencies = [
    "langchain-core>=1.0.0,<2",
    "langchain-text-splitters>=1.0.0,<2",
    "chromadb>=1.3.0,<2",
    "langchain-chroma>=1.0.0,<2",
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.3.0,<3",
    "jsonschema>=4.0.0",
    "tenacity>=8.0.0",
    "tiktoken>=0.7.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.15.4",
    "rich>=13.0.0",
    "langchain-openai>=1.0.0,<2",
]

[project.urls]
Homepage = "https://github.com/kushangpatel/aiforge"
Repository = "https://github.com/kushangpatel/aiforge"
Issues = "https://github.com/kushangpatel/aiforge/issues"
Changelog = "https://github.com/kushangpatel/aiforge/blob/main/CHANGELOG.md"
Documentation = "https://github.com/kushangpatel/aiforge/tree/main/docs"

[project.optional-dependencies]
openai = ["langchain-openai>=1.0.0,<2"]
anthropic = [
    "langchain-anthropic>=1.4.0,<2",
    "langchain-voyageai>=0.1.0,<1",
]
# Kept for backward compatibility; same as [anthropic].
anthropicai = [
    "langchain-anthropic>=1.4.0,<2",
    "langchain-voyageai>=0.1.0,<1",
]
local = ["langchain-ollama>=1.0.0,<2"]
gemini = ["langchain-google-genai>=4.0.0,<5"]
bedrock = ["langchain-aws>=1.5.0,<2"]
mistral = ["langchain-mistralai>=1.1.3,<2"]
agentic = ["langgraph>=1.0.0,<2"]
pinecone = ["pinecone>=5.1.0,<11"]
qdrant = ["qdrant-client>=1.10.0,<2"]
pgvector = ["psycopg[binary]>=3.1.0,<4"]
server = ["fastapi>=0.115.0", "uvicorn>=0.32.0"]
playground = ["streamlit>=1.40.0"]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "langsmith>=0.1.0",
]
docs = ["pypdf>=4.0.0", "python-docx>=1.0.0"]
mcp = ["mcp>=2.0.0,<3"]
site = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]
all = [
    "aiforge-kit[anthropic,local,gemini,bedrock,mistral,agentic,pinecone,qdrant,pgvector,server,playground,observability,docs,mcp,dev]",
]

[project.scripts]
aiforge = "aiforge.cli.main:app"

[tool.setuptools.dynamic]
version = {attr = "aiforge.__version__.__version__"}

# Only the aiforge package goes in the wheel: tests/, docs/, development-docs/,
# scripts/ and a local aiforge_data/ are left out ("aiforge*" would match the
# last one, since namespace packages are discovered too).
[tool.setuptools.packages.find]
where = ["."]
include = ["aiforge", "aiforge.*"]

# Non-Python files loaded at runtime. playground/pages/*.py has no __init__.py
# (Streamlit loads the pages by path), so it is listed explicitly.
[tool.setuptools.package-data]
aiforge = [
    "py.typed",
    "templates/*",
    "templates/.env.example",
    "playground/pages/*.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"aiforge/cli/*.py" = ["B008"]
