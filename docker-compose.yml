services:
  # ── API Server ────────────────────────────────────────────
  api:
    build: .
    ports:
      - "${AIFORGE_PORT:-8000}:8000"
    env_file: .env
    environment:
      - AIFORGE_CHROMA_PERSIST_DIR=/data/chroma
    volumes:
      - chroma-data:/data/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Playground UI ─────────────────────────────────────────
  playground:
    build: .
    ports:
      - "${AIFORGE_PLAYGROUND_PORT:-8501}:8501"
    env_file: .env
    environment:
      - AIFORGE_API_BASE=http://api:8000
    command: ["playground", "--port", "8501"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma-data:
